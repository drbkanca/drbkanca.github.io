name: Sync DergiPark content
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run sync:data
      - name: Commit updated DergiPark data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/journalata.json
          if git diff --cached --quiet; then
            echo "No DergiPark data changes to commit."
          else
            git commit -m "Sync DergiPark content"
            git push
          fi
